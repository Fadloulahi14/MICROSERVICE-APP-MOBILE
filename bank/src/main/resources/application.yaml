spring:
  application:
    name: banque_221
  datasource:
    url: jdbc:postgresql://localhost:5434/banque_221
    username: banque_user
    password: banque_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

server:
  port: 8081

security:
  jwt:
    secret: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU2Nzg5
    expiration-ms: 86400000
  users:
    - name: admin
      password: admin123
      roles: ADMIN

    - name: user1
      password: user123
      roles: USER

    - name: agent1
      password: agent123
      roles: AGENT